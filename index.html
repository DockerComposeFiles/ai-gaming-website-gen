<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&family=VT323&family=Audiowide&family=Chakra+Petch:wght@500;700&family=Cinzel:wght@600;800&family=MedievalSharp&family=Press+Start+2P&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
  /* Layout: full-screen game HUD, header bar + procedurally partitioned panel grid. Tokens are rewritten per genre at runtime. */
  :root {
    color-scheme: dark;
    --bg: #05070c; --fg: #3ff; --ac: #f3c; --warn: #f53; --warn-a: rgba(255,85,51,.35); --dim: rgba(51,255,255,.25);
    --panel: rgba(10,20,30,.55); --panel-solid: #0b1420;
    --font-head: 'Orbitron', 'Segoe UI', sans-serif; --font-mono: 'Share Tech Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-mono);
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #app {
    position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; gap: 10px;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 8px 14px; border: 1px solid var(--dim); background: var(--panel);
    backdrop-filter: blur(3px);
  }
  .logo { font-family: var(--font-head); font-size: 22px; letter-spacing: .12em; color: var(--fg);
    text-shadow: 0 0 8px var(--fg), 0 0 22px var(--fg); position: relative; white-space: nowrap; }
  .logo::before, .logo::after { content: attr(data-t); position: absolute; inset: 0; opacity: .7; }
  .logo::before { color: var(--ac); animation: gl1 3.2s infinite steps(1); }
  .logo::after { color: var(--warn); animation: gl2 2.7s infinite steps(1); }
  @keyframes gl1 { 0%,92%,100% { transform: none; clip-path: inset(0 0 100% 0); } 93% { transform: translate(-3px,1px); clip-path: inset(10% 0 55% 0); } 96% { transform: translate(2px,-1px); clip-path: inset(60% 0 5% 0); } }
  @keyframes gl2 { 0%,88%,100% { transform: none; clip-path: inset(0 0 100% 0); } 89% { transform: translate(3px,0); clip-path: inset(40% 0 30% 0); } 91% { transform: translate(-2px,1px); clip-path: inset(5% 0 80% 0); } }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; flex: 1; font-variant-numeric: tabular-nums; }
  .stats span { opacity: .55; margin-right: 6px; }
  .stats b, .stats i { font-weight: normal; font-style: normal; color: var(--ac); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font-family: var(--font-head); font-size: 11px; letter-spacing: .14em; color: var(--bg); background: var(--fg);
    border: 0; padding: 8px 12px; cursor: pointer; clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    transition: filter .15s, transform .1s; white-space: nowrap;
  }
  button.alt { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  button.alt.on { background: var(--ac); color: var(--bg); box-shadow: none; }
  button:hover { filter: brightness(1.3) drop-shadow(0 0 6px var(--fg)); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

  /* ---------- grid ---------- */
  #grid { flex: 1; display: grid; gap: 10px; min-height: 0; }
  .panel {
    position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel); border: 1px solid var(--dim); cursor: pointer;
    opacity: 0; transform: scale(.94); filter: brightness(3);
    transition: opacity .35s, transform .35s, filter .6s;
  }
  .panel.on { opacity: 1; transform: none; filter: none; }
  .panel.on:hover { filter: brightness(1.18); }
  .panel.swap { animation: swap .5s; }
  @keyframes swap { 0% { filter: brightness(3) hue-rotate(40deg); transform: scale(.97); } 100% { filter: none; transform: none; } }
  .ph {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 11px; letter-spacing: .14em;
    border-bottom: 1px solid var(--dim); white-space: nowrap; overflow: hidden;
  }
  .ph .t { font-family: var(--font-head); color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
  .ph .c { opacity: .45; margin-left: auto; }
  .ph .d { width: 7px; height: 7px; background: var(--ac); box-shadow: 0 0 6px var(--ac); flex: none; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .cv { flex: 1; position: relative; min-height: 0; }
  .cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* frame variants */
  body.f-chamfer .panel { clip-path: polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); border: 0;
    box-shadow: inset 0 0 0 1px var(--dim); }
  body.f-bracket .panel { border-color: transparent; }
  body.f-bracket .panel::before, body.f-bracket .panel::after { content: ''; position: absolute; width: 16px; height: 16px; pointer-events: none; }
  body.f-bracket .panel::before { top: -1px; left: -1px; border-top: 2px solid var(--fg); border-left: 2px solid var(--fg); }
  body.f-bracket .panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--fg); border-right: 2px solid var(--fg); }
  body.f-glow .panel { border-color: var(--fg); box-shadow: 0 0 12px -2px var(--fg), inset 0 0 18px -8px var(--fg); border-radius: 6px; }
  body.f-tab .ph { background: var(--fg); border: 0; }
  body.f-tab .ph .t, body.f-tab .ph .c { color: var(--bg); }
  body.f-tab .ph .d { background: var(--bg); box-shadow: none; }
  body.f-ornate .panel { border: 1px solid var(--dim); border-radius: 3px; margin: 3px;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--dim), inset 0 0 34px -12px var(--fg); }
  body.f-ornate .ph { letter-spacing: .22em; }
  body.f-ornate .ph .d { transform: rotate(45deg); border-radius: 0; }
  body.f-ornate button { clip-path: none; border-radius: 2px; }
  body.f-pixel .panel { border: 0; margin: 4px; box-shadow: 0 -4px 0 0 var(--fg), 0 4px 0 0 var(--fg), -4px 0 0 0 var(--fg), 4px 0 0 0 var(--fg); }
  body.f-pixel .ph { background: var(--fg); border: 0; font-size: 9px; }
  body.f-pixel .ph .t, body.f-pixel .ph .c { color: var(--bg); }
  body.f-pixel .ph .d { background: var(--bg); box-shadow: none; }
  body.f-pixel header { border: 0; box-shadow: 0 -4px 0 0 var(--fg), 0 4px 0 0 var(--fg), -4px 0 0 0 var(--fg), 4px 0 0 0 var(--fg); margin: 4px; }
  body.f-pixel button { clip-path: none; font-size: 9px; }
  body.f-pixel .logo { font-size: 16px; }

  /* ---------- CRT overlay ---------- */
  #crt { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  body.crt #crt {
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);
    animation: flick 4s infinite;
  }
  @keyframes flick { 0%,97%,100% { opacity: 1; } 98% { opacity: .7; } }

  /* ---------- game events ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  body.alert #fx { animation: alertpulse .45s infinite alternate; }
  @keyframes alertpulse { from { box-shadow: inset 0 0 0 3px var(--warn), inset 0 0 60px var(--warn-a); } to { box-shadow: inset 0 0 0 6px var(--warn), inset 0 0 160px var(--warn-a); } }
  body.shake #grid { animation: shake .45s; }
  @keyframes shake { 20% { transform: translate(-6px,3px); } 40% { transform: translate(5px,-4px); } 60% { transform: translate(-4px,-2px); } 80% { transform: translate(3px,4px); } }
  body.glitch #app { animation: glitchfx .38s steps(3); }
  @keyframes glitchfx { 0% { filter: hue-rotate(90deg) saturate(3); transform: translate(8px,0) skewX(4deg); } 50% { filter: invert(.85); transform: translate(-6px,2px); } 100% { filter: none; transform: none; } }
  #toasts { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end; max-width: calc(100% - 32px); }
  .toast { background: var(--panel-solid); border-left: 3px solid var(--ac); box-shadow: 0 0 22px -6px var(--ac);
    padding: 9px 16px; font-family: var(--font-head); font-size: 14px; letter-spacing: .06em; color: var(--fg);
    transform: translateX(130%); transition: transform .4s cubic-bezier(.2,1.4,.4,1); }
  .toast.in { transform: none; }
  .toast small { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .22em; color: var(--ac); margin-bottom: 2px; }
  #killfeed { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 86px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  #killfeed div { background: var(--panel-solid); padding: 3px 10px; font-size: 12px; border-right: 2px solid var(--warn); animation: kin .3s; transition: opacity .5s; }
  #killfeed b { color: var(--warn); font-weight: normal; margin: 0 6px; }
  @keyframes kin { from { transform: translateX(40px); opacity: 0; } }
  #banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-family: var(--font-head);
    font-size: clamp(20px, 5vw, 54px); letter-spacing: .18em; padding: 16px; opacity: 0; transform: scaleY(0);
    transition: opacity .25s, transform .25s; text-wrap: balance; }
  #banner.in { opacity: 1; transform: none; }
  #banner.warn { color: var(--warn); background: linear-gradient(90deg, transparent, var(--warn-a), transparent); text-shadow: 0 0 18px var(--warn); }
  #banner.good { color: var(--ac); background: linear-gradient(90deg, transparent, var(--panel-solid), transparent); text-shadow: 0 0 18px var(--ac); }
  #autobar { position: fixed; left: 0; top: 0; height: 3px; width: 0; background: var(--ac); box-shadow: 0 0 8px var(--ac); z-index: 7; }

  /* ---------- boot screen ---------- */
  #boot { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column;
    justify-content: center; padding: 0 max(16px, 12vw); font-size: 14px; transition: opacity .4s; }
  #boot.off { opacity: 0; pointer-events: none; }
  #boot pre { white-space: pre-wrap; line-height: 1.5; min-height: 9em; font-family: inherit; }
  #boot .bar { height: 6px; margin-top: 16px; border: 1px solid var(--fg); }
  #boot .bar i { display: block; height: 100%; width: 0; background: var(--fg); box-shadow: 0 0 10px var(--fg); }

  @media (max-width: 760px) {
    html, body { height: auto; }
    #app { height: auto; min-height: 100vh; }
    .logo { font-size: 17px; }
    .stats { font-size: 11px; gap: 10px; flex-basis: 100%; order: 3; }
    #grid { flex: none; }
    #killfeed { top: auto; bottom: 120px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo::before, .logo::after, #crt, body.alert #fx, body.shake #grid, body.glitch #app { animation: none !important; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <header>
    <div class="logo" id="logo"></div>
    <div class="stats" id="stats"></div>
    <div class="btns">
      <button id="reroll" type="button" title="Neues UI generieren (R)">REROLL [R]</button>
      <button id="genre" type="button" class="alt" title="Genre wechseln (G)">GENRE: MIX</button>
      <button id="auto" type="button" class="alt" title="Alle 10 s ein neues UI (A)">AUTO [A]</button>
      <button id="sound" type="button" class="alt" title="Soundeffekte an/aus (M)">SOUND [M]</button>
      <button id="share" type="button" class="alt" title="Link zu genau diesem UI kopieren">LINK</button>
    </div>
  </header>
  <main id="grid"></main>
</div>
<div id="crt"></div>
<div id="fx"><div id="killfeed"></div><div id="banner"></div><div id="toasts"></div></div>
<div id="autobar"></div>
<div id="boot"><pre id="bootlog"></pre><div class="bar"><i id="bootbar"></i></div></div>

<script>
'use strict';
/* =====================================================================
   HUD GENERATOR – every load builds a different game interface.
   ?seed=1234&genre=fantasy reproduces a specific UI.
   Keys: R reroll · G genre · A autoplay · M sound · click a panel to swap it.
   ===================================================================== */

// ---------- seeded random ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = Math.random;
const rnd = (a = 1, b) => b === undefined ? R() * a : a + R() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(R() * arr.length)];
const chance = p => R() < p;
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hex = n => Math.floor(Math.random() * 16 ** n).toString(16).toUpperCase().padStart(n, '0');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function tag() {
  return pick(['', '', 'xX', 'Dark', 'Neo', 'Sir', 'Lil', 'Mr', 'Its', 'The']) +
    pick(['Sniper', 'Pixel', 'Ghost', 'Viper', 'Noob', 'Raven', 'Blaze', 'Wolf', 'Byte', 'Fury', 'Toast', 'Kraken', 'Lynx', 'Nova']) +
    pick(['', '', String(Math.floor(Math.random() * 99)), 'Xx', '_TTV', '42', 'HD']);
}
const fill = s => s.replace(/\{n\}/g, () => 1 + Math.floor(Math.random() * 9)).replace(/\{h\}/g, () => hex(4))
  .replace(/\{g\}/g, () => ['ALPHA', 'SIGMA', 'KILO', 'DELTA', 'NOVA', 'ECHO'][Math.floor(Math.random() * 6)]).replace(/\{p\}/g, () => tag());

// =====================================================================
// GENRES – palette, type, frames, backgrounds and vocabulary
// =====================================================================
const GENRES = {
  scifi: {
    label: 'SCI-FI',
    pal: () => { const h = pick([175, 190, 205, 220, 250, 270]); return [[h, 100, 60], [(h + irnd(140, 200)) % 360, 100, 62]]; },
    fonts: [["'Orbitron', sans-serif", "'Share Tech Mono', monospace"], ["'Audiowide', sans-serif", "'Share Tech Mono', monospace"]],
    frames: ['f-chamfer', 'f-bracket', 'f-glow'], bgs: ['stars', 'hex', 'floor'],
    A: ['NEXUS', 'VOID', 'OMEGA', 'ORBITAL', 'QUANTUM', 'NOVA', 'STELLAR', 'HELIX'], B: ['COMMAND', 'PROTOCOL', 'DRIVE', 'STATION', 'FLEET', 'SYSTEMS'],
    stats: ['SHIELD', 'HULL', 'ENERGY', 'FUEL', 'HEAT', 'O2', 'WARP'], units: ['CR', 'PTS', 'GJ'],
    bosses: ['DREADNOUGHT X-9', 'HIVE MOTHER', 'VOID LEVIATHAN', 'AI OVERSEER Σ'],
    weapons: ['PULSE RIFLE', 'RAILGUN MK-II', 'ION CANNON', 'PLASMA CASTER'],
    quests: ['Scan the derelict ship', 'Repair the warp core', 'Escort the cargo freighter', 'Destroy pirate beacons', 'Collect quantum shards', 'Reach the jump gate'],
    ach: ['First Contact', 'Light Speed', 'Hull Integrity 100%', 'Pirate Hunter', 'Deep Space Explorer'],
    loot: ['Plasma Core', 'Nano Repair Kit', 'Quantum Shard', 'Graviton Lens'],
    alerts: ['INCOMING HOSTILES', 'HULL BREACH', 'SHIELDS CRITICAL', 'PROXIMITY ALERT'],
    log: ['> handshake {h}:{h} ... OK', '[WARN] hull breach deck {n}', '> warp coil {n}0% charged', '[OK] shield regen {n}/s', 'docking request {h} granted', '[CRIT] reactor unstable', '> scan sector {g}-{n} complete'],
  },
  cyber: {
    label: 'CYBERPUNK',
    pal: () => pick([[[320, 100, 60], [185, 100, 55]], [[55, 100, 55], [190, 100, 55]], [[185, 100, 55], [330, 100, 62]], [[275, 100, 66], [55, 100, 55]]]),
    fonts: [["'Chakra Petch', sans-serif", "'Share Tech Mono', monospace"], ["'Rajdhani', sans-serif", "'Share Tech Mono', monospace"], ["'Audiowide', sans-serif", "'Chakra Petch', sans-serif"]],
    frames: ['f-glow', 'f-tab', 'f-chamfer'], bgs: ['rain', 'floor', 'dots'],
    A: ['NEON', 'CHROME', 'GHOST', 'NIGHT', 'SYNTH', 'DATA', 'HEX'], B: ['RUNNER', 'CITY', 'LINK', 'SHADOW', 'NET', 'WIRE'],
    stats: ['HP', 'RAM', 'HEAT', 'CRED', 'HUMANITY', 'BANDWIDTH'], units: ['¥', '€$', 'BTC'],
    bosses: ['CORPO ENFORCER K-7', 'ROGUE AI MIRAGE', 'GANG BOSS RAZOR', 'ICE DAEMON'],
    weapons: ['SMART PISTOL', 'MONO-WIRE', 'TECH SHOTGUN', 'NEURO SMG'],
    quests: ['Hack the corp mainframe', 'Deliver the data shard', 'Escape the trace', 'Install a new cyberdeck', 'Find the fixer', 'Wipe your records'],
    ach: ['Ghost in the Wire', 'Chrome Addict', 'Street Legend', 'Zero Trace'],

    alerts: ['ICE DETECTED', 'TRACE IN PROGRESS', 'FIREWALL BREACH', 'SYSTEM OVERHEAT'],
    log: ['> jack in node {h} ... OK', '[WARN] ICE layer {n} active', '+{n}00 €$ transferred', '> quickhack {g} uploaded', '[CRIT] trace {n}0%', '> decrypt {h}{h} {n}0%', '{p} pinged you'],
  },
  fantasy: {
    label: 'FANTASY',
    pal: () => pick([[[42, 85, 58], [150, 70, 50]], [[42, 85, 58], [350, 80, 58]], [[38, 90, 60], [270, 70, 68]], [[160, 60, 55], [42, 85, 60]]]),
    fonts: [["'Cinzel', serif", "'Rajdhani', sans-serif"], ["'MedievalSharp', serif", "'Rajdhani', sans-serif"]],
    frames: ['f-ornate'], bgs: ['embers', 'stars'],
    A: ['ELDER', 'SHADOW', 'IRON', 'DRAGON', 'RUNE', 'EMBER', 'MYTHIC'], B: ['REALM', 'THRONE', 'LEGENDS', 'SAGA', 'KEEP', 'CROWN'],
    stats: ['VITALITY', 'MANA', 'STAMINA', 'FAITH', 'RAGE', 'XP'], units: ['GOLD', 'SOULS', 'RUNES'],
    titles: {
      radar: ['SCRYING ORB', 'DIVINATION'], network: ['LEY LINES', 'CONSTELLATION'], terminal: ['CHRONICLE', 'JOURNAL'],

      globe: ['WORLD SPHERE', 'ORACLE'], cube: ['RELIC', 'RUNESTONE'], wave: ['ARCANE FLOW', 'SPELL WEAVE'],
      rings: ['MANA CORE', 'SPELL CIRCLE'], reticle: ['HUNTER SIGHT', 'MARKED PREY'], tunnel: ['PORTAL', 'RIFT'],
      weapon: ['EQUIPPED', 'QUIVER'], loading: ['CRAFTING', 'ENCHANTING'], spectrum: ['AURA', 'POWER'],
      heat: ['CORRUPTION', 'MIASMA'], graph: ['ECONOMY', 'MORALE'], inventory: ['SPELLBOOK', 'SATCHEL'],

    log: ['+{n}{n} gold looted', '[WARN] curse stacks: {n}', 'You learned a new spell', '{p} joined the party', '[CRIT] armor durability low', '+{n}0 XP  // goblin slain', '> rune of {g} inscribed'],
  },
  military: {
    label: 'TACTICAL',
    pal: () => pick([[[95, 55, 55], [38, 100, 58]], [[38, 100, 55], [95, 40, 70]], [[150, 60, 50], [45, 100, 60]], [[200, 15, 75], [20, 100, 58]]]),
    fonts: [["'Black Ops One', sans-serif", "'Share Tech Mono', monospace"], ["'Rajdhani', sans-serif", "'Share Tech Mono', monospace"]],
    frames: ['f-bracket', 'f-line', 'f-tab'], bgs: ['grid', 'dots', 'hex'],
    A: ['TASK FORCE', 'DELTA', 'IRON', 'GHOST', 'STRIKE', 'BRAVO'], B: ['RECON', 'OPS', 'WARFARE', 'ASSAULT', 'COMMAND'],
    stats: ['HEALTH', 'ARMOR', 'STAMINA', 'SUPPRESSION', 'STEALTH'], units: ['XP', 'PTS'],
    bosses: ['HEAVY JUGGERNAUT', 'GUNSHIP', 'ARMORED WALKER', 'SNIPER NEST'],
    weapons: ['ASSAULT RIFLE', 'DMR', 'LMG', 'SHOTGUN', 'SMG'],
    quests: ['Secure the LZ', 'Destroy the AA battery', 'Extract the VIP', 'Plant explosives', 'Hold position', 'Recover intel'],
    ach: ['Sharpshooter', 'Untouchable', 'Demolition Expert', 'Squad Leader'],
    loot: ['Thermal Scope', 'Ammo Crate', 'Frag Grenades', 'Med Kit'],
    alerts: ['INCOMING ARTILLERY', 'ENEMY UAV ONLINE', 'AIRSTRIKE INBOUND', 'TAKING FIRE'],
    log: ['[RADIO] Bravo-{n} in position', '> UAV sweep grid {n}{n}', '[WARN] enemy squad {n}00m', '+{n}0 XP  // headshot', '[OK] resupply drop', '[CRIT] squadmate down', '{p} called in a strike'],
  },
  arcade: {
    label: 'ARCADE',
    pal: () => { const h = pick([0, 50, 120, 190, 290, 320]); return [[h, 100, 60], [(h + 180) % 360, 100, 60]]; },

const GENRE_KEYS = Object.keys(GENRES);
let G, genreKey, forcedGenre = null;

// ---------- theme ----------
let P; // palette
function makeTheme() {
  const [fg, ac] = G.pal();
  const warn = [pick([0, 8, 350]), 100, 60];
  const bg = [fg[0], genreKey === 'military' ? 20 : 45, rnd(2.5, 5)];
  P = {
    fg: a => hsl(fg[0], fg[1], fg[2], a), ac: a => hsl(ac[0], ac[1], ac[2], a),
    warn: a => hsl(warn[0], warn[1], warn[2], a), bg: a => hsl(bg[0], bg[1], bg[2], a),
    fgH: fg, acH: ac,
  };
  const [head, mono] = pick(G.fonts);
  P.head = head; P.mono = mono;
  const s = document.documentElement.style;
  s.setProperty('--bg', P.bg(1)); s.setProperty('--fg', P.fg(1)); s.setProperty('--ac', P.ac(1));
  s.setProperty('--warn', P.warn(1)); s.setProperty('--warn-a', P.warn(.3)); s.setProperty('--dim', P.fg(.28));
  s.setProperty('--panel', hsl(bg[0], bg[1], bg[2] + 4, rnd(.45, .75)));
  s.setProperty('--panel-solid', hsl(bg[0], bg[1], bg[2] + 6, .94));
  s.setProperty('--font-head', head + ', sans-serif'); s.setProperty('--font-mono', mono + ', monospace');
  document.body.className = pick(G.frames) + (G.crt || chance(.7) ? ' crt' : '');
  P.bgMode = pick(G.bgs);
  P.glow = chance(.75);
}

// ---------- canvas helpers ----------
function txt(ctx, s, x, y, size, color, align = 'left', font = P.mono) {
  ctx.font = `${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function glow(ctx, c, b = 8) { if (P.glow) { ctx.shadowColor = c; ctx.shadowBlur = b; } }
function noGlow(ctx) { ctx.shadowBlur = 0; }
function gridLines(ctx, w, h, step, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = step; x < w; x += step) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); }
  for (let y = step; y < h; y += step) { ctx.moveTo(0, y + .5); ctx.lineTo(w, y + .5); }
  ctx.stroke();
}
function makeNoise(seed) {
  const r = mulberry32(seed), p = new Float32Array(256);
  for (let i = 0; i < 256; i++) p[i] = r();
  const h = (x, y) => p[(x * 73 + y * 151 + (x ^ y) * 7) & 255];
  const sm = t => t * t * (3 - 2 * t);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
  };
}
function hslToRgb(h, s, l) {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255].map(Math.round);
}

W.radar = {
  titles: ['RADAR', 'PROXIMITY SCAN', 'SONAR', 'THREAT DETECT'],
  make() {
    const speed = rnd(.8, 2.2), rings = irnd(3, 5), blips = [], sweepW = rnd(.4, 1.1);
    return (ctx, w, h, t, dt) => {
      const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 10, a = (t * speed) % (Math.PI * 2);
      ctx.strokeStyle = P.fg(.3); ctx.lineWidth = 1;
      for (let i = 1; i <= rings; i++) { ctx.beginPath(); ctx.arc(cx, cy, r * i / rings, 0, 7); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
      for (let i = 0; i < 36; i++) {
        const q = i / 36 * Math.PI * 2, l = i % 3 ? 4 : 9;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(q) * r, cy + Math.sin(q) * r);
        ctx.lineTo(cx + Math.cos(q) * (r - l), cy + Math.sin(q) * (r - l)); ctx.stroke();
      }
      const steps = 24;
      for (let i = 0; i < steps; i++) {
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, a - sweepW * (i + 1) / steps, a - sweepW * i / steps);
        ctx.fillStyle = P.fg(.28 * (1 - i / steps)); ctx.fill();
      }
      glow(ctx, P.fg(1)); ctx.strokeStyle = P.fg(1); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
      if (Math.random() < dt * 2.5) blips.push({ a, d: rnd(.15, .95), life: 1, hostile: chance(.35) });
      for (let i = blips.length - 1; i >= 0; i--) {
        const b = blips[i]; b.life -= dt * .35;
        if (b.life <= 0) { blips.splice(i, 1); continue; }
        const x = cx + Math.cos(b.a) * r * b.d, y = cy + Math.sin(b.a) * r * b.d, c = b.hostile ? P.warn : P.ac;
        glow(ctx, c(1)); ctx.fillStyle = c(b.life);
        ctx.beginPath(); ctx.arc(x, y, 3 + (1 - b.life) * 2, 0, 7); ctx.fill();
        if (b.hostile && b.life > .6) { ctx.strokeStyle = c(b.life); ctx.lineWidth = 1; ctx.strokeRect(x - 7, y - 7, 14, 14); }
      }
      noGlow(ctx);
      txt(ctx, `${blips.length.toString().padStart(2, '0')} CONTACTS`, 8, h - 10, 11, P.fg(.8));
      txt(ctx, `${Math.round(a * 57.3).toString().padStart(3, '0')}°`, w - 8, h - 10, 11, P.fg(.8), 'right');
    };
  }
};

W.hexmap = {
  titles: ['SECTOR MAP', 'HEX GRID', 'TERRITORY', 'ZONE CONTROL'],

      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const x = i * hw + (j & 1 ? hw / 2 : 0), y = j * size * 1.5, n = noise(i * .35 + t * .15, j * .35), d = Math.hypot(i - px, j - py);

W.network = {
  titles: ['NETWORK', 'NODE MAP', 'SQUAD LINK', 'MESH', 'UPLINK'],
  make() {
    const nodes = Array.from({ length: irnd(8, 18) }, () => ({ x: rnd(.08, .92), y: rnd(.1, .9), p: rnd(0, 6), s: rnd(.5, 2), big: chance(.15) }));
    const edges = [];
    nodes.forEach((a, i) => nodes.forEach((b, j) => { if (j > i && Math.hypot(a.x - b.x, a.y - b.y) < .32) edges.push([i, j]); }));
    const pulses = [];
    return (ctx, w, h, t, dt) => {
      const pos = nodes.map(n => [(n.x + Math.sin(t * .3 * n.s + n.p) * .02) * w, (n.y + Math.cos(t * .25 * n.s + n.p) * .02) * h]);
      ctx.lineWidth = 1; ctx.strokeStyle = P.fg(.25); ctx.beginPath();
      edges.forEach(([i, j]) => { ctx.moveTo(...pos[i]); ctx.lineTo(...pos[j]); }); ctx.stroke();
      if (edges.length && Math.random() < dt * 5) pulses.push({ e: pick(edges), u: 0, s: rnd(.6, 1.6), rev: chance(.5) });
      glow(ctx, P.ac(1), 10);
      for (let k = pulses.length - 1; k >= 0; k--) {
        const p = pulses[k]; p.u += dt * p.s; if (p.u >= 1) { pulses.splice(k, 1); continue; }
        const [i, j] = p.rev ? [p.e[1], p.e[0]] : p.e, u = p.u;
        ctx.fillStyle = P.ac(1); ctx.beginPath();
        ctx.arc(pos[i][0] + (pos[j][0] - pos[i][0]) * u, pos[i][1] + (pos[j][1] - pos[i][1]) * u, 2.5, 0, 7); ctx.fill();

      nodes.forEach((n, i) => {

  }
};

W.reticle = {

// LAYOUT – binary space partition of a grid
// =====================================================================

  if (stop) { out.push({ x, y, w, h }); return; }
  const vert = canV && (!canH || (w / h > 1.25 ? chance(.85) : h / w > 1.25 ? chance(.15) : chance(.5)));
  if (vert) { const s = irnd(minS, w - minS); bsp(x, y, s, h, depth + 1, out, minS); bsp(x + s, y, w - s, h, depth + 1, out, minS); }
  else { const s = irnd(minS, h - minS); bsp(x, y, w, s, depth + 1, out, minS); bsp(x, y + s, w, h - s, depth + 1, out, minS); }
}
const WIDE_OK = ['wave', 'spectrum', 'graph', 'terminal', 'stats', 'counter', 'heat', 'inventory', 'hexmap', 'boss', 'compass', 'loading', 'leader', 'quests', 'weapon'];

    ['PING', '<i id="ping">--</i>ms'], ['TIME', '<i id="clock"></i>'], ['SEED', seed],

// ---------- background ----------
const bgc = $('#bg'), bgx = bgc.getContext('2d');
function makeBg() {

  const embers = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * .6 + .2, p: Math.random() * 6 }));
  const glyphs = 'アカサタナハマヤラワ0123456789ABCDEF<>/*#', drops = [];

    bgx.fillStyle = P.bg(1); bgx.fillRect(0, 0, w, h);

// ---------- loop ----------
let last = performance.now(), pingT = 0, evT = 4, auto = false, autoT = 0;

  }

// ---------- controls ----------
function cycleGenre() {
  const order = [null, ...GENRE_KEYS], i = order.indexOf(forcedGenre);
  forcedGenre = order[(i + 1) % order.length]; reroll();
}
function toggleAuto() { auto = !auto; autoT = 0; $('#auto').classList.toggle('on', auto); }
function toggleSound() { soundOn = !soundOn; $('#sound').classList.toggle('on', soundOn); if (soundOn) SFX.ach(); }

$('#reroll').onclick = () => reroll();
$('#genre').onclick = cycleGenre;
$('#auto').onclick = toggleAuto;
$('#sound').onclick = toggleSound;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') reroll(); else if (k === 'g') cycleGenre(); else if (k === 'a') toggleAuto(); else if (k === 'm') toggleSound();
});
$('#share').onclick = async e => {
  const url = location.origin + location.pathname + '?seed=' + seed + '&genre=' + genreKey;
  try { await navigator.clipboard.writeText(url); e.target.textContent = 'KOPIERT ✓'; }
  catch { toast(url, 'LINK ZU DIESEM UI'); }
  setTimeout(() => e.target.textContent = 'LINK', 1400);
};
let lastNarrow = innerWidth < 760;
addEventListener('resize', () => { const n = innerWidth < 760; if (n !== lastNarrow) { lastNarrow = n; reroll(seed); } });

// ---------- start ----------
let qs; try { qs = new URLSearchParams(location.search); } catch { qs = new URLSearchParams(); }
const qSeed = qs.get('seed'), qGenre = qs.get('genre');
if (qGenre && GENRES[qGenre]) forcedGenre = qGenre;
reroll(qSeed && /^\d+$/.test(qSeed) ? +qSeed : undefined);
requestAnimationFrame(frame);
</script>
</body>
</html>
